<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Huy Phong</title>
    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            line-height: 1.6;
        }

        .demo-box {
            border: 1px solid #ddd;
            padding: 12px;
        }

        .demo-box input {
            padding: 6px 8px;
            width: 200px;
            max-width: 100%;
        }

        #ds {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        #ds li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 8px 0;
            cursor: pointer;
            user-select: none;
        }

        /* Gạch ngang khi đã mua */
        #ds li.da-mua span {
            text-decoration: line-through;
            color: gray;
        }

        #thong-ke {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="demo-box">
        <form id="form">
            <label for="o-ten">Tên món:</label>
            <input type="text" name="o-ten" id="o-ten" placeholder="VD: pizza">
            <button type="submit">Thêm món</button>
        </form>

        <div id="thong-ke">Còn 0/0 món chưa mua</div>

        <ul id="ds"></ul>
    </div>

    <script>
        const form = document.querySelector("#form");
        const oTen = document.querySelector("#o-ten");
        const ds = document.querySelector("#ds");
        const thongKe = document.querySelector("#thong-ke");

        // Hàm cập nhật lại số lượng x/y và lưu localStorage
        function capNhatVaLuu() {
            const cacLi = ds.querySelectorAll("li");
            let tongSo = cacLi.length;
            let chuaMua = 0;

            for (let i = 0; i < cacLi.length; i++) {
                if (!cacLi[i].classList.contains("da-mua")) {
                    chuaMua++;
                }
            }

            thongKe.textContent = "Còn " + chuaMua + "/" + tongSo + " món chưa mua";

            // Lưu HTML vào localStorage
            localStorage.setItem("danh_sach_di_cho", ds.innerHTML);
        }

        // Load dữ liệu cũ khi vừa mở trang
        if (localStorage.getItem("danh_sach_di_cho")) {
            ds.innerHTML = localStorage.getItem("danh_sach_di_cho");
            
            // Gắn lại sự kiện cho các thẻ li cũ vừa load từ localStorage lên
            const cacLiCu = ds.querySelectorAll("li");
            for (let i = 0; i < cacLiCu.length; i++) {
                ganSuKienChoLi(cacLiCu[i]);
            }
            
            // Cập nhật lại số lượng hiển thị ban đầu
            let tongSo = cacLiCu.length;
            let chuaMua = 0;
            for (let i = 0; i < cacLiCu.length; i++) {
                if (!cacLiCu[i].classList.contains("da-mua")) chuaMua++;
            }
            thongKe.textContent = "Còn " + chuaMua + "/" + tongSo + " món chưa mua";
        }

        // Hàm phụ trợ để gắn sự kiện click và dblclick cho li
        function ganSuKienChoLi(li) {
            // Bấm 1 lần -> đánh dấu đã mua / bỏ đánh dấu
            li.addEventListener("click", function() {
                li.classList.toggle("da-mua");
                capNhatVaLuu();
            });

            // Nháy đúp -> xóa món
            li.addEventListener("dblclick", function() {
                li.remove();
                capNhatVaLuu();
            });
        }

        // Sự kiện thêm món mới
        form.addEventListener("submit", function(e) {
            e.preventDefault(); // không để trang tải lại
            const ten = oTen.value.trim();
            if (ten === "") return; // tên null bỏ qua

            // tạo dòng mới
            const li = document.createElement("li");

            // tên món ăn
            const span = document.createElement("span");
            span.textContent = ten;

            li.appendChild(span);

            // Gắn sự kiện cho li mới tạo
            ganSuKienChoLi(li);

            // Gắn vào danh sách
            ds.appendChild(li);

            // Cập nhật thống kê và lưu trữ
            capNhatVaLuu();

            oTen.value = ""; // clear input
            oTen.focus(); // sẵn sàng gõ món tiếp theo
        });
    </script>
</body>
</html>
